services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: yieldempire-app:latest
    container_name: yieldempire-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      # Override the (empty) DB_* vars baked into the image so the app
      # can actually connect to Supabase. These mirror .env.
      DB_CONNECTION: "pgsql"
      DB_HOST: "aws-0-eu-west-1.pooler.supabase.com"
      DB_PORT: "6543"
      DB_DATABASE: "postgres"
      DB_USERNAME: "postgres.wwuiijrkrmlbspglxrel"
      DB_PASSWORD: "Madueke468$"
    volumes:
      - ../:/var/www/html
      - /var/www/html/vendor
    networks:
      - yieldnet

  web:
    image: nginx:1.25-alpine
    container_name: yieldempire-web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - yieldnet

networks:
  yieldnet:
    driver: bridge